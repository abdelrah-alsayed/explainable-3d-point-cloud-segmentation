<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PointNet++ Training Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpolyline points='1,14 5,8 9,10 15,2' fill='none' stroke='%234b3fae' stroke-width='2.4'/%3E%3C/svg%3E">
<script src="data/fonts.js"></script>
<style>
/* Same look as the XAI explorer: settings column on the left, results on the right. */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --ink: #1a2130; --muted: #5c6677; --line: #d8dce3;
  --accent: #4b3fae; --accent-soft: #ecebfa; --good: #1a7f4b; --bad: #b2182b;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-code: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101319; --surface: #171b23; --ink: #e7eaf0; --muted: #9aa3b2; --line: #2a303b;
    --accent: #a59cff; --accent-soft: #25223f; --good: #4cc38a; --bad: #e0475a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101319; --surface: #171b23; --ink: #e7eaf0; --muted: #9aa3b2; --line: #2a303b;
  --accent: #a59cff; --accent-soft: #25223f; --good: #4cc38a; --bad: #e0475a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); padding-inline: 16px; padding-block: 16px 40px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; }
header.top { margin: 0 0 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
header.top p { margin: 0; color: var(--muted); }
.theme-pick { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.theme-pick .seg button { font-size: 12px; padding: 3px 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
aside.panel { align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.step { display: grid; gap: 5px; }
.step > .lbl { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg.col { flex-direction: column; align-items: stretch; }
.seg.col button { text-align: left; display: flex; justify-content: space-between; gap: 8px; }
.seg button { font: inherit; font-size: 13px; padding: 5px 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; cursor: pointer; }
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.seg button small { opacity: .75; font-family: var(--font-data); margin-left: 4px; }
.seg button i.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.fixed { font-family: var(--font-data); font-size: 13px; padding: 5px 9px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
main { display: grid; gap: 16px; min-width: 0; }
.path { font-family: var(--font-data); font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; }
.path b { color: var(--ink); font-weight: 500; }
.path span.sep { opacity: .5; }
.legend { display: flex; align-items: center; gap: 8px; font-family: var(--font-data); font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend .chip { display: inline-flex; align-items: center; gap: 5px; margin-right: 8px; }
.legend .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.note.warn { color: var(--ink); }
table.top { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.top th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 3px 6px; vertical-align: bottom; }
table.top td { padding: 4px 6px; border-bottom: 1px solid var(--line); font-family: var(--font-data); font-variant-numeric: tabular-nums; }
table.top td.t { font-family: var(--font-body); }
table.top td.r, table.top th.r { text-align: right; }
table.top tr:hover td { background: var(--accent-soft); }
table.top tr.sel td { background: var(--accent-soft); }
table.top.nowrap td, table.top.nowrap th { white-space: nowrap; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart svg.small { max-width: 620px; }
.chart text { fill: var(--muted); font: 11px var(--font-data); }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.loading { padding: 40px; text-align: center; color: var(--muted); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 14px; font-weight: 500; padding: 8px 14px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; border-radius: 0; }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); background: none; }
.step.off { opacity: .4; pointer-events: none; }
.panel .chart-body { margin-top: 10px; }
.panel > .note { margin-top: 4px; }
.metrics { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; margin-top: 8px; }
.metrics span { color: var(--muted); }
.metrics b { font-family: var(--font-data); font-weight: 500; color: var(--ink); }
table.heat { border-collapse: separate; border-spacing: 3px; font-size: 12.5px; }
table.heat th { font-weight: 500; color: var(--muted); padding: 2px 6px; text-align: center; vertical-align: bottom; }
table.heat th.r { text-align: right; vertical-align: middle; }
table.heat td { font-family: var(--font-data); text-align: center; padding: 6px 8px; border-radius: 4px; min-width: 62px; }
table.heat td.cell { cursor: pointer; }
table.heat td.cell:hover { outline: 2px solid var(--accent); }
table.heat td.empty { color: var(--line); cursor: default; }
table.heat.conf td { min-width: 50px; padding: 5px 6px; }
table.heat.conf th { white-space: nowrap; }
table.heat.conf th.corner { font-size: 11px; text-align: left; line-height: 1.3; }
.conf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.conf-grid > div { min-width: 0; }
.conf-grid .note { margin-bottom: 4px; font-weight: 600; color: var(--ink); }
.scroll-x { overflow-x: auto; max-width: 100%; }
.wide { grid-column: 1 / -1; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.save { font: inherit; font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; cursor: pointer; white-space: nowrap; }
.save:hover { border-color: var(--accent); color: var(--ink); }
.link { font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.glance div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.glance b { display: block; font: 600 20px var(--font-data); }
.glance span { font-size: 12px; color: var(--muted); }
.findings { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.hist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); grid-auto-flow: row dense; gap: 12px; }
.hist-grid > div { border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-width: 0; }
.hist-grid > div.span { grid-column: 1 / -1; }
.hist-grid .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.hist-grid > div.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
code { font-family: var(--font-code); font-size: 12px; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  aside.panel { position: static; max-height: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1>PointNet++ Training Explorer</h1>
  <p>Part segmentation on ShapeNetPart · training curves and test results · saved results only</p>
  <div class="theme-pick"><span class="hint" id="h-font">Font</span><div class="seg" id="c-font"></div><span class="hint">Theme</span><div class="seg" id="c-theme"></div></div>
</header>
<div class="app">
  <aside class="panel" aria-label="Settings">
    <div class="step" id="s-exp"><div class="lbl"><span>Experiment</span></div><div class="seg col" id="c-exp"></div><p class="hint" id="h-exp"></p></div>
    <div class="step" id="s-cat"><div class="lbl"><span>Category</span></div><div class="seg" id="c-cat"></div><p class="hint" id="h-cat"></p></div>
    <div class="step" id="s-seed"><div class="lbl"><span>Seed</span></div><div class="seg" id="c-seed"></div></div>
    <hr>
    <div class="step" id="s-curve"><div class="lbl"><span>Curves</span></div><div class="seg" id="c-curve"></div></div>
    <div class="step" id="s-seedview"><div class="lbl"><span>Runs with 10 seeds</span></div><div class="seg" id="c-seedview"></div></div>
  </aside>
  <main><div class="tabs" id="tabs"></div><div id="main" style="display:grid;gap:16px;min-width:0"><div class="panel loading">Loading data…</div></div></main>
</div>

<script src="data/train.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const T = window.TRAIN_DATA;
const FONT_SETS = window.FONT_SETS || {};
const TABS = [["overview", "Overview"], ["dataset", "Dataset"], ["run", "One run"], ["compare", "Compare runs"], ["singlejoint", "Single vs joint"], ["seeds", "Seeds"], ["test", "Test results"]];
const SEED_EXPS = ["parts2_cap312", "parts3_cap626", "parts4_cap596", "parts4_cap740"];
const SHORT = { full_parts_per_category: "single", full_parts_joint_model: "joint", "full-dataset": "full data", mechanical_joint: "mech. joint",
  parts2_cap312: "2 parts", parts3_cap626: "3 parts", parts4_cap596: "4 parts", parts4_cap740: "740 shapes" };
const EXP_COLOR = { full_parts_per_category: "#5b4fc4", full_parts_joint_model: "#d9711c", "full-dataset": "#2e8b57", mechanical_joint: "#9c6b30",
  parts2_cap312: "#2c7fb8", parts3_cap626: "#c23b5a", parts4_cap596: "#17a2a2", parts4_cap740: "#7b8a1e" };
const MODEL_COLOR = { single: EXP_COLOR.full_parts_per_category, joint: EXP_COLOR.full_parts_joint_model };
const TEST_CATS = T ? Object.keys(T.test) : [];
const S = { tab: "overview", exp: "full_parts_per_category", category: "Airplane", seed: 42, curve: "raw", seedview: "band", theme: "light", dshist: "count", font: "plex" };
try { Object.assign(S, JSON.parse(localStorage.getItem("train-explorer-v1") || "{}")); } catch (e) {}

/* ================= data helpers ================= */
const RUNS = T ? T.runs : [];
const EXP = id => T.experiments.find(e => e.id === id);
const ALL_CATS = [...new Set(RUNS.flatMap(r => r.categories))].sort();
const runsOf = (exp, cat) => RUNS.filter(r => r.exp === exp && (!cat || r.categories.includes(cat)));
const catsOf = exp => [...new Set(runsOf(exp).flatMap(r => r.categories))].sort();
const expsOf = cat => T.experiments.map(e => e.id).filter(e => runsOf(e, cat).length);
const multi = r => r.categories.length > 1;
/* test mIoU of one category at every epoch: the log for runs with several categories, else the class mIoU (= the category) */
const catCurve = (r, cat) => multi(r) ? r.cat_series[cat] : r.series.test_class_avg_iou;
const singleRun = cat => runsOf("full_parts_per_category", cat)[0];
const jointRun = () => runsOf("full_parts_joint_model")[0];
const gpuName = r => (r.env.gpu || "?").replace("NVIDIA ", "").replace(" 12GB", "");
const hours = r => r.series.epoch_time_seconds.reduce((a, b) => a + b, 0) / 3600;
function withinEpoch(r, tol = 0.005) { const s = r.series.test_instance_avg_iou, b = s[r.best_epoch - 1]; return s.findIndex(v => v >= b - tol) + 1; }
function seedGroups() {
  const out = [];
  for (const e of SEED_EXPS) for (const c of catsOf(e)) { const rs = runsOf(e, c); out.push({ exp: e, cat: c, runs: rs, vals: rs.map(r => r.best_cat[c]) }); }
  return out;
}

/* ================= small maths ================= */
const mean = a => { const f = a.filter(Number.isFinite); return f.length ? f.reduce((x, y) => x + y, 0) / f.length : NaN; };
const quantile = (s, q) => { const h = (s.length - 1) * q, i = Math.floor(h); return i + 1 < s.length ? s[i] + (h - i) * (s[i + 1] - s[i]) : s[i]; };
const median = a => { const s = a.filter(Number.isFinite).sort((x, y) => x - y); return s.length ? quantile(s, 0.5) : NaN; };
const sd = a => { const f = a.filter(Number.isFinite), m = mean(f); return f.length > 1 ? Math.sqrt(f.reduce((x, v) => x + (v - m) ** 2, 0) / (f.length - 1)) : 0; };
const fmt = (v, n = 3) => { if (v === null || v === undefined || Number.isNaN(v)) return "–"; const s = Number(v).toFixed(n); return /^-0(\.0*)?$/.test(s) ? s.slice(1) : s; };   // never "-0.00"
const sgn = (v, n = 3) => (v > 0 && fmt(v, n) !== fmt(0, n) ? "+" : "") + fmt(v, n);
const fmtInt = v => Number(v).toLocaleString("en-US");
function ranks(a) { const idx = a.map((v, i) => i).sort((x, y) => a[x] - a[y]), r = new Array(a.length); let i = 0; while (i < idx.length) { let j = i; while (j + 1 < idx.length && a[idx[j + 1]] === a[idx[i]]) j++; for (let k = i; k <= j; k++) r[idx[k]] = (i + j) / 2; i = j + 1; } return r; }
function spearman(a, b) { const ra = ranks(a), rb = ranks(b), ma = mean(ra), mb = mean(rb); let n = 0, da = 0, db = 0; for (let i = 0; i < a.length; i++) { n += (ra[i] - ma) * (rb[i] - mb); da += (ra[i] - ma) ** 2; db += (rb[i] - mb) ** 2; } return n / Math.sqrt(da * db); }
/* centred moving average over w epochs (shorter at the ends); missing values are skipped */
function smooth(a, w = 5) { if (S.curve !== "smooth") return a; const h = Math.floor(w / 2); return a.map((_, i) => mean(a.slice(Math.max(0, i - h), i + h + 1).filter(v => v !== null))); }
const pts = a => a.map((v, i) => [i + 1, v]).filter(p => p[1] !== null && Number.isFinite(p[1]));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ================= colours ================= */
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function hexRgb(h) { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function palette() { const p = {}; for (const k of ["bg", "surface", "ink", "muted", "line", "accent", "good", "bad"]) p[k] = css("--" + k); return p; }

/* ================= SVG charts ================= */
function niceStep(span, n = 4) {
  const raw = (span || 1) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * mag >= raw * 0.999) return m * mag;
  return 10 * mag;
}
function ticksIn(lo, hi, n = 4) {
  const st = niceStep(hi - lo, n), out = [];
  for (let v = Math.ceil(lo / st - 1e-9) * st; v <= hi + st * 1e-9; v += st) out.push(Math.abs(v) < st * 1e-9 ? 0 : v);
  return out;
}
function tickDec(lo, hi, n = 4) { const st = niceStep(hi - lo, n); for (let d = 0; d < 7; d++) if (Math.abs(Math.round(st * 10 ** d) - st * 10 ** d) < 1e-6) return d; return 4; }
/* axis range: a little padding, then widened to round values; never-negative values never get a negative axis */
function niceRange(vals, padFrac = 0.06, incl = null, n = 4) {
  const fin = vals.filter(Number.isFinite);
  let lo = Math.min(...fin), hi = Math.max(...fin);
  if (incl !== null) { lo = Math.min(lo, incl); hi = Math.max(hi, incl); }
  if (!Number.isFinite(lo)) { lo = 0; hi = 1; }
  const nonNeg = lo >= 0, pad = (hi - lo) * padFrac || Math.abs(hi) * 0.1 || 0.1;
  lo -= pad; hi += pad;
  const st = niceStep(hi - lo, 2 * n); lo = Math.floor(lo / st + 1e-9) * st; hi = Math.ceil(hi / st - 1e-9) * st;
  if (nonNeg && lo < 0) lo = 0;
  return [lo, hi];
}
/* every axis includes 0: a range above 0 starts at 0 (its top rounded up to the next tick, so the top line has a label);
   a range below 0 ends at 0 */
function fromZero(lo, hi, n = 4) {
  if (lo > 0) { const st = niceStep(hi, n); return [0, Math.ceil(hi / st - 1e-9) * st]; }
  if (hi < 0) { const st = niceStep(-lo, n); return [Math.floor(lo / st + 1e-9) * st, 0]; }
  return [lo, hi];
}
/* y range of curves: every value, and 0 (every chart's axes start at 0) */
function curveRange(series, cap1 = false) {
  const vals = [];
  for (const se of series) { (se.pts || []).forEach(q => vals.push(q[1])); (se.band || []).forEach(q => vals.push(q[1], q[2])); }
  let [lo, hi] = niceRange(vals, 0.06, 0);
  if (cap1 && hi > 1) hi = 1;
  return [lo, hi];
}
let clipN = 0;
/* line chart: series {pts:[[x,y]], color, dash, w, opacity} or {band:[[x,lo,hi]], color} or {dots:[[x,y,title]], color};
   vlines [{x, color, dash, label}]; hover(x) -> text for an invisible column at every whole x */
function lineChart(o) {
  { const [x0, x1] = o.xmin > 0 ? [0, o.xmax] : [o.xmin, o.xmax], [y0, y1] = fromZero(o.ylo, o.yhi); o = { ...o, xmin: x0, xmax: x1, ylo: y0, yhi: y1 }; }   // both axes start at 0
  const W = o.W || 560, H = o.H || 290, L = 56, R = 14, T = o.vlabels ? 22 : 12, B = 42, id = "clip" + (++clipN);
  const x = v => L + (v - o.xmin) / ((o.xmax - o.xmin) || 1) * (W - L - R), y = v => T + (o.yhi - v) / ((o.yhi - o.ylo) || 1) * (H - T - B);
  const nd = tickDec(o.ylo, o.yhi), xd = tickDec(o.xmin, o.xmax, 6);
  let s = `<svg ${o.wide ? "" : 'class="small"'} viewBox="0 0 ${W} ${H}" data-xlo="${o.xmin}" data-ylo="${o.ylo}" role="img" aria-label="${o.ylab} against ${o.xlab}">`;
  s += `<defs><clipPath id="${id}"><rect x="${L}" y="${T - 3}" width="${W - L - R}" height="${H - T - B + 6}"/></clipPath></defs>`;
  for (const v of ticksIn(o.ylo, o.yhi)) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${o.pal.line}" stroke-width="0.8"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(o.yfmt ? o.yfmt(v) : v, nd)}</text>`;
  for (const v of ticksIn(o.xmin, o.xmax, 6)) s += `<text x="${x(v)}" y="${H - 24}" text-anchor="middle">${fmt(v, xd)}</text>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 5}" text-anchor="middle">${o.xlab}</text>`;
  s += `<text transform="translate(12 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">${o.ylab}</text>`;
  if (o.zero && o.ylo < 0 && o.yhi > 0) s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="${o.pal.muted}" stroke-width="1"/>`;
  if (o.hover) for (let v = Math.ceil(o.xmin); v <= o.xmax; v++) { const t = o.hover(v); if (t) s += `<rect x="${x(v - 0.5)}" y="${T}" width="${Math.max(0.5, x(v + 0.5) - x(v - 0.5))}" height="${H - T - B}" fill="transparent"><title>${esc(t)}</title></rect>`; }
  for (const v of o.vlines || []) {
    s += `<line x1="${x(v.x)}" x2="${x(v.x)}" y1="${T}" y2="${H - B}" stroke="${v.color}" stroke-width="${v.w || 1}" ${v.dash ? `stroke-dasharray="${v.dash}"` : ""} opacity="${v.opacity || 1}" pointer-events="none"/>`;
    if (v.label) s += `<text x="${x(v.x)}" y="${T - 7}" text-anchor="middle" style="fill:${v.color}">${v.label}</text>`;
  }
  s += `<g clip-path="url(#${id})">`;

/* ================= one run ================= */

/* ================= compare runs of one category ================= */
function curveSeries(exp, c, pal, label) {
  const rs = runsOf(exp, c), col = EXP_COLOR[exp];
  if (rs.length === 1) return [{ pts: pts(smooth(catCurve(rs[0], c))), color: col, w: 2, name: label }];
  const curves = rs.map(r => smooth(catCurve(r, c))), n = Math.max(...curves.map(a => a.length));
  if (S.seedview === "each") return curves.map(a => ({ pts: pts(a), color: col, w: 1, opacity: 0.55, name: label }));
  const band = [], mid = [];
  for (let i = 0; i < n; i++) { const v = curves.map(a => a[i]).filter(Number.isFinite); if (!v.length) continue; band.push([i + 1, Math.min(...v), Math.max(...v)]); mid.push([i + 1, mean(v)]); }
  return [{ band, color: col }, { pts: mid, color: col, w: 2, name: label }];
}
function renderCompare(m) {
  const pal = palette(), c = S.category, exps = expsOf(c);
  m.insertAdjacentHTML("beforeend", pathLine([c, `${exps.length} experiments`, `${exps.reduce((a, e) => a + runsOf(e, c).length, 0)} runs`]));
  const series = exps.flatMap(e => curveSeries(e, c, pal, EXP(e).label)), n = Math.max(...exps.flatMap(e => runsOf(e, c).map(r => r.epochs)));
  const [lo, hi] = curveRange(series, true);
  const hover = ep => `epoch ${ep} · ` + exps.map(e => { const v = runsOf(e, c).map(r => catCurve(r, c)[ep - 1]).filter(Number.isFinite); return v.length ? `${SHORT[e]} ${fmt(mean(v), 3)}` : null; }).filter(Boolean).join(" · ");
  m.appendChild(panel(`Test mIoU of ${c} per epoch, every experiment`, `One colour per experiment. ${exps.some(e => SEED_EXPS.includes(e)) ? (S.seedview === "band" ? "Runs with 10 seeds: the line is the mean, the band goes from the lowest to the highest seed." : "Runs with 10 seeds: one thin line per seed.") : ""} ${n > 100 ? "The full-dataset run trained for 251 epochs." : ""}`,
    lineChart({ pal, ...epochX(n), ylo: lo, yhi: hi, ylab: `test mIoU of ${c}`, series, wide: true, W: 900, H: 340, hover }) +
    legend(exps.map(e => [EXP_COLOR[e], EXP(e).label])), "wide"));

  // table and dot strip of the saved scores
  const rows = exps.map(e => { const rs = runsOf(e, c), v = rs.map(r => r.best_cat[c]); return { e, rs, v, m: mean(v), tr: rs[0].counts[c][0], te: rs[0].counts[c][1], last: mean(rs.map(r => catCurve(r, c)[r.epochs - 1])), be: rs.map(r => r.best_epoch) }; });
  let t = `<div class="scroll-x"><table class="top nowrap"><thead><tr><th>Experiment</th><th class="r">Runs</th><th class="r">Training shapes</th><th class="r">Test shapes</th><th class="r">Saved checkpoint</th><th class="r">Last epoch</th><th class="r">Saved epoch</th></tr></thead><tbody>`;
  for (const r of rows) t += `<tr><td class="t"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${EXP_COLOR[r.e]};margin-right:6px"></i><button type="button" class="link" data-exp="${r.e}">${EXP(r.e).label}</button></td><td class="r">${r.rs.length}</td><td class="r">${fmtInt(r.tr)}</td><td class="r">${fmtInt(r.te)}</td>
    <td class="r">${fmt(r.m)}${r.rs.length > 1 ? ` ± ${fmt(sd(r.v))}` : ""}</td><td class="r">${fmt(r.last)}</td><td class="r">${Math.min(...r.be) === Math.max(...r.be) ? r.be[0] : Math.min(...r.be) + "–" + Math.max(...r.be)}</td></tr>`;
  t += `</tbody></table></div>`;
  const hiR = rows.reduce((a, b) => b.m > a.m ? b : a), loR = rows.reduce((a, b) => b.m < a.m ? b : a);
  const tp = panel(`Saved test mIoU of ${c}`, `The value of the saved checkpoint. ± = standard deviation over the seeds. Last epoch = mean at the end of training. The test shapes are not the same in every experiment (see the column), so a higher number can also mean easier test shapes.`,
    t + (rows.length > 1 ? `<ul class="findings"><li>Highest: <b>${EXP(hiR.e).label}</b> (${fmt(hiR.m)}). Lowest: <b>${EXP(loR.e).label}</b> (${fmt(loR.m)}). Difference ${fmt(hiR.m - loR.m)}.</li></ul>` : ""));
  tp.classList.add("wide"); m.appendChild(tp);

  tp.querySelectorAll("[data-exp]").forEach(b => b.addEventListener("click", () => go(SEED_EXPS.includes(b.dataset.exp) ? "seeds" : "run", b.dataset.exp, c)));

}

  const cols = []; d.parts.forEach((p, q) => { for (const [mo, arr] of [["single", S1], ["joint", J1]]) cols.push({ label: p.name, sub: mo, values: arr.map(o => o.parts[q]), color: MODEL_COLOR[mo], titles: arr.map(o => "object #" + o.o) }); });
  grid.appendChild(panel(`${c}: IoU of each part`, "One dot per object. The bar and the number are the median.",
    `<div class="scroll-x"><div style="min-width:${Math.max(360, cols.length * 62)}px">${stripChart(cols, { pal, ylo: 0, yhi: 1, ylab: "part IoU", cw: 62, r: 2.4, opacity: 0.45, nd: 2 })}</div></div>` + legend([[MODEL_COLOR.single, "single model"], [MODEL_COLOR.joint, "joint model"]]), "wide"));
  // confusion matrices
  const names = d.parts.map(p => p.name), SC = d.single_conf, JC = d.joint_conf;
  grid.appendChild(panel(`${c}: confusion matrix of the parts`, `All points of the ${n} test objects (${fmtInt(n * 2048)} points). Each row is a true part; the numbers say where its points went, in % of the row. The diagonal = points with the right part (this is the recall). Change: joint − single in percentage points; green = better for the joint model (more right points, or fewer mistakes), red = worse.`,
    `<div class="conf-grid" style="grid-template-columns:repeat(auto-fit, minmax(min(100%, ${120 + names.length * 60}px), 1fr))"><div><p class="note">Single model</p>${confTable(SC, names, pal, "single")}</div><div><p class="note">Joint model</p>${confTable(JC, names, pal, "joint")}</div><div><p class="note">Change (joint − single)</p>${confDiffTable(SC, JC, names, pal)}</div></div>` +
    `<ul class="findings"><li>Most common mistake, single model: ${biggestMistake(SC, names)}.</li><li>Most common mistake, joint model: ${biggestMistake(JC, names)}.</li></ul>`, "wide"));
  // precision and recall per part, from the confusion matrices
  const pr = M => names.map((_, i) => { const tp = M[i][i], row = M[i].reduce((a, b) => a + b, 0), col = M.reduce((a, r) => a + r[i], 0); return { rec: tp / row, prec: col ? tp / col : NaN, n: row, pred: col }; });
  const ps = pr(SC), pj = pr(JC), cell = (a, b) => `<td class="r">${fmt(a)}</td><td class="r" style="${Math.abs(b - a) >= 0.02 ? `color:${b > a ? MODEL_COLOR.joint : MODEL_COLOR.single};font-weight:600` : ""}">${fmt(b)}</td>`;
  let prt = `<div class="scroll-x"><table class="top nowrap"><thead><tr><th>Part</th><th class="r">True points</th><th class="r">Recall single</th><th class="r">Recall joint</th><th class="r">Precision single</th><th class="r">Precision joint</th></tr></thead><tbody>`;
  names.forEach((nm, i) => { prt += `<tr><td class="t">${nm}</td><td class="r">${fmtInt(ps[i].n)}</td>${cell(ps[i].rec, pj[i].rec)}${cell(ps[i].prec, pj[i].prec)}</tr>`; });
  prt += `</tbody></table></div>`;
  const low = (arr, k) => arr.reduce((a, b, i) => (b[k] < arr[a][k] ? i : a), 0);
  grid.appendChild(panel(`${c}: precision and recall of each part`, "Recall: of the points that really belong to the part, the share the model found. Precision: of the points the model called this part, the share that is right. Low recall = the model misses the part; low precision = it paints the part too big. Coloured = the joint value differs by 0.02 or more (orange: higher, purple: lower).",
    prt + `<ul class="findings"><li>Lowest recall: ${names[low(ps, "rec")]} (single ${fmt(ps[low(ps, "rec")].rec)}), ${names[low(pj, "rec")]} (joint ${fmt(pj[low(pj, "rec")].rec)}).</li><li>Lowest precision: ${names[low(ps, "prec")]} (single ${fmt(ps[low(ps, "prec")].prec)}), ${names[low(pj, "prec")]} (joint ${fmt(pj[low(pj, "prec")].prec)}).</li></ul>`));
  // joint − single per part, with intervals
  const pf = d.parts.map((p, q) => ({ label: p.name, ...bootCI(S1.map((o, i) => J1[i].parts[q] - o.parts[q]), `${c}/part/${q}`) }));
  grid.appendChild(panel(`${c}: joint − single for each part`, `Part IoU of the joint model − part IoU of the single model, per object. Dot = mean; line = 95 % interval (bootstrap over the ${n} test objects). Grey band: ±${fmt(maxRange)}.`,
    forestChart(pf, { pal, band: maxRange, xlab: "joint − single (part IoU)", W: 560, L: 84, R: 178 })));
  // hardest objects
  const order = S1.map((o, i) => i).sort((a, b) => (S1[a].miou + J1[a].miou) - (S1[b].miou + J1[b].miou)).slice(0, 10);
  let wt = `<div class="scroll-x"><table class="top nowrap"><thead><tr><th>Object</th><th class="r">mIoU single</th><th class="r">mIoU joint</th>${d.parts.map(p => `<th class="r">${p.name}</th>`).join("")}</tr></thead><tbody>`;
  for (const i of order) wt += `<tr><td>#${S1[i].o}</td><td class="r">${fmt(S1[i].miou)}</td><td class="r">${fmt(J1[i].miou)}</td>${d.parts.map((p, q) => `<td class="r">${fmt(S1[i].parts[q], 2)} / ${fmt(J1[i].parts[q], 2)}</td>`).join("")}</tr>`;
  wt += `</tbody></table></div>`;
  grid.appendChild(panel(`${c}: the 10 hardest objects`, "Lowest mean of the two models first. Part columns: single / joint. The object numbers are the same as in the XAI explorer.", wt, "wide"));
}

/* ================= render, theme ================= */
function render() {
  if (!T) return;
  const a = document.activeElement, box = a && a.tagName === "BUTTON" && a.parentElement && a.parentElement.id ? a.parentElement.id : null;
  normalize(); applyFont(); save(); renderControls();
  const m = $("main"); m.innerHTML = "";
  ({ overview: renderOverview, dataset: renderDataset, run: renderRun, compare: renderCompare, singlejoint: renderSingleJoint, seeds: renderSeeds, test: renderTest })[S.tab](m);
  addPanelSaves(m);
  if (box) { const el = document.getElementById(box); const b = el && (el.querySelector('button[aria-pressed="true"]') || el.querySelector("button")); if (b) b.focus({ preventScroll: true }); }
}
/* the font set: CSS font stacks of the page; saved images take the same faces (see svgImage and exportRegion) */
function applyFont() { const f = FONT_SETS[S.font]; if (!f) return; const r = document.documentElement; r.dataset.font = S.font; for (const k of ["body", "data", "code"]) r.style.setProperty("--font-" + k, f[k]); }
function applyTheme() { if (S.theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme); }
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
if (TABS.some(t => "#" + t[0] === location.hash)) S.tab = location.hash.slice(1);
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== S.tab) set("tab", h); });
window.__train = { state: () => JSON.parse(JSON.stringify(S)), set: (k, v) => set(k, v), go };   // for the automated tests
applyTheme(); applyFont();
if (!T) $("main").innerHTML = `<div class="panel loading">No data found. Run build_data.py next to this page.</div>`;
else render();
</script>
